<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OnPoint Travels</title>
    <style>
      :root {
        color-scheme: light;
        --brand-gold: #c8ad5f;
        --ink: #2c261c;
        --paper: #fffdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background:
          radial-gradient(circle at top, rgba(200, 173, 95, 0.18), transparent 38rem),
          var(--paper);
        color: var(--ink);
        display: flex;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 2rem;
        text-align: center;
      }

      main {
        max-width: 42rem;
      }

      img {
        border-radius: 2rem;
        box-shadow: 0 1.5rem 4rem rgba(44, 38, 28, 0.16);
        height: auto;
        max-width: min(18rem, 72vw);
      }

      h1 {
        font-size: clamp(2.25rem, 8vw, 4.75rem);
        letter-spacing: -0.05em;
        line-height: 0.95;
        margin: 2rem 0 1rem;
      }

      p {
        color: rgba(44, 38, 28, 0.76);
        font-size: clamp(1.05rem, 3vw, 1.35rem);
        line-height: 1.6;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="onpoint-travels.png" alt="OnPoint Travels globe and airplane logo" />
      <h1>OnPoint Travels</h1>
      <p>Curated travel planning that keeps every journey seamless, memorable, and on point.</p>
    </main>
  </body>
</html>
